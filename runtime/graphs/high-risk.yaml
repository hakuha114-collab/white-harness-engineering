{
  "id": "high-risk",
  "version": "2.0.0",
  "description": "Strict graph for security, migration, production, and destructive side effects.",
  "nodes": {
    "start": {"agent": "pm-dispatcher", "checkpoint": true},
    "requirement": {"agent": "requirement-analyzer", "gate": "check-spec"},
    "design": {"agent": "solution-designer", "gate": "check-design"},
    "risk": {"agent": "risk-controller", "gate": "check-risk", "policy": "rules/policies.yaml"},
    "human_approval": {"policy": "side_effect_policy", "checkpoint": true},
    "implement": {"agent": "code-developer", "checkpoint": true},
    "style_gate": {"gate": "check-code-style"},
    "security_gate": {"gate": "check-security"},
    "coverage_gate": {"gate": "check-test-coverage"},
    "review": {"agent": "code-reviewer", "gate": "check-review-pass", "clean_context": true},
    "record": {"agent": "project-recorder", "gate": "check-knowledge-stale"},
    "deliver": {"agent": "project-recorder", "checkpoint": true}
  },
  "edges": [
    {"from": "start", "on": "PASS", "to": "requirement"},
    {"from": "requirement", "on": "PASS", "to": "design"},
    {"from": "requirement", "on": "WARN", "to": "design"},
    {"from": "requirement", "on": "FAIL", "to": "requirement"},
    {"from": "design", "on": "PASS", "to": "risk"},
    {"from": "design", "on": "WARN", "to": "risk"},
    {"from": "design", "on": "FAIL", "to": "requirement"},
    {"from": "risk", "on": "PASS", "to": "human_approval"},
    {"from": "risk", "on": "WARN", "to": "human_approval"},
    {"from": "risk", "on": "FAIL", "to": "design"},
    {"from": "risk", "on": "BLOCK", "to": "human_approval"},
    {"from": "human_approval", "on": "PASS", "to": "implement"},
    {"from": "human_approval", "on": "FAIL", "to": "risk"},
    {"from": "implement", "on": "PASS", "fan_out": ["style_gate", "security_gate", "coverage_gate"]},
    {"from": "style_gate", "on": "PASS", "to": "review"},
    {"from": "style_gate", "on": "WARN", "to": "review"},
    {"from": "style_gate", "on": "FAIL", "to": "implement"},
    {"from": "security_gate", "on": "PASS", "to": "review"},
    {"from": "security_gate", "on": "FAIL", "to": "implement"},
    {"from": "security_gate", "on": "BLOCK", "to": "human_approval"},
    {"from": "coverage_gate", "on": "PASS", "to": "review"},
    {"from": "coverage_gate", "on": "WARN", "to": "review"},
    {"from": "coverage_gate", "on": "FAIL", "to": "implement"},
    {"from": "review", "on": "PASS", "to": "record"},
    {"from": "review", "on": "FAIL", "to": "implement"},
    {"from": "record", "on": "PASS", "to": "deliver"},
    {"from": "record", "on": "WARN", "to": "deliver"},
    {"from": "deliver", "on": "PASS", "to": "done"}
  ]
}
