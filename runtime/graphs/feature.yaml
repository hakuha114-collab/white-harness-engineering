{
  "id": "feature",
  "version": "2.0.0",
  "description": "Feature graph with task memory, checkpoint/resume, and fan-out/fan-in verification.",
  "nodes": {
    "start": {"agent": "pm-dispatcher", "checkpoint": true},
    "requirement": {"agent": "requirement-analyzer", "gate": "check-spec", "writes": ["subtasks.json"]},
    "design": {"agent": "solution-designer", "gate": "check-design", "writes": ["TECH_SPEC.md"]},
    "risk": {"agent": "risk-controller", "gate": "check-risk", "policy": "rules/policies.yaml"},
    "implement": {"agent": "code-developer", "checkpoint": true},
    "style_gate": {"gate": "check-code-style"},
    "security_gate": {"gate": "check-security"},
    "unit_gate": {"gate": "check-test-coverage"},
    "verify_merge": {"fan_in": ["style_gate", "security_gate", "unit_gate"], "checkpoint": true},
    "review": {"agent": "code-reviewer", "gate": "check-review-pass", "clean_context": true},
    "acceptance": {"agent": "test-validator", "gate": "check-test-coverage"},
    "record": {"agent": "project-recorder", "gate": "check-knowledge-stale"},
    "deliver": {"agent": "project-recorder", "checkpoint": true}
  },
  "edges": [
    {"from": "start", "on": "PASS", "to": "requirement"},
    {"from": "requirement", "on": "PASS", "to": "design"},
    {"from": "requirement", "on": "WARN", "to": "design"},
    {"from": "requirement", "on": "FAIL", "to": "requirement"},
    {"from": "design", "on": "PASS", "to": "risk"},
    {"from": "design", "on": "WARN", "to": "risk"},
    {"from": "design", "on": "FAIL", "to": "requirement"},
    {"from": "risk", "on": "PASS", "to": "implement"},
    {"from": "risk", "on": "WARN", "to": "implement"},
    {"from": "risk", "on": "FAIL", "to": "design"},
    {"from": "risk", "on": "BLOCK", "to": "human_approval"},
    {"from": "implement", "on": "PASS", "fan_out": ["style_gate", "security_gate", "unit_gate"]},
    {"from": "style_gate", "on": "PASS", "to": "verify_merge"},
    {"from": "style_gate", "on": "WARN", "to": "verify_merge"},
    {"from": "style_gate", "on": "FAIL", "to": "implement"},
    {"from": "security_gate", "on": "PASS", "to": "verify_merge"},
    {"from": "security_gate", "on": "FAIL", "to": "implement"},
    {"from": "security_gate", "on": "BLOCK", "to": "human_approval"},
    {"from": "unit_gate", "on": "PASS", "to": "verify_merge"},
    {"from": "unit_gate", "on": "WARN", "to": "verify_merge"},
    {"from": "unit_gate", "on": "FAIL", "to": "implement"},
    {"from": "verify_merge", "on": "PASS", "to": "review"},
    {"from": "review", "on": "PASS", "to": "acceptance"},
    {"from": "review", "on": "FAIL", "to": "implement"},
    {"from": "acceptance", "on": "PASS", "to": "record"},
    {"from": "acceptance", "on": "WARN", "to": "record"},
    {"from": "acceptance", "on": "FAIL", "to": "implement"},
    {"from": "record", "on": "PASS", "to": "deliver"},
    {"from": "record", "on": "WARN", "to": "deliver"},
    {"from": "record", "on": "FAIL", "to": "record"},
    {"from": "deliver", "on": "PASS", "to": "done"}
  ]
}
