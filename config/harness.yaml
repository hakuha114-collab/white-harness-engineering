{
  "harness": {
    "name": "white-harness-engineering",
    "version": "2.2.0",
    "runtime": {
      "enabled": true,
      "state_root": ".harness",
      "schema": "runtime/schema/task_state.schema.json",
      "graph_dir": "runtime/graphs",
      "default_workflow": "normal",
      "trace_file": "timeline.ndjson",
      "checkpoint_dir": "checkpoints"
    },
    "audit": {
      "enabled": true,
      "storage": ".harness/audit",
      "retention_days": 90,
      "trace_replay_required": true
    },
    "gate": {
      "principle": "No Evidence, No Pass",
      "result_schema_version": "2.0.0",
      "exit_codes": {
        "PASS": 0,
        "FAIL": 1,
        "WARN": 2,
        "BLOCK": 3
      },
      "on_fail": "rollback",
      "max_rollback": 3,
      "on_max_rollback": "human_intervention"
    },
    "reviewer": {
      "clean_context": true,
      "inherit_developer_reasoning": false,
      "inherit_chat_history": false,
      "allowed_inputs": [
        "SPEC.md",
        "TECH_SPEC.md",
        "diff",
        "relevant_code",
        "test_results",
        "evidence",
        "rules",
        "policies"
      ]
    },
    "budget": {
      "max_tokens": 150000,
      "max_tool_calls": 100,
      "max_rollbacks": 3,
      "max_wall_minutes": 240
    },
    "agents": {
      "default_timeout_minutes": 60,
      "timeout_overrides_minutes": {
        "pm-dispatcher": 5,
        "requirement-analyzer": 30,
        "solution-designer": 60,
        "risk-controller": 30,
        "code-developer": 120,
        "code-reviewer": 60,
        "test-validator": 90,
        "project-recorder": 15
      }
    },
    "rule_levels": {
      "L0": {"action": "terminate", "notify": ["tech_lead", "security"]},
      "L1": {"action": "rollback", "notify": ["developer"]},
      "L2": {"action": "warn", "notify": []},
      "L3": {"action": "note", "notify": []}
    },
    "coverage": {
      "core_logic": {"lines": 80, "branches": 70, "functions": 90},
      "utility": {"lines": 90, "branches": 80, "functions": 95},
      "api_controller": {"lines": 70, "branches": 60, "functions": 80},
      "config": {"lines": 50, "branches": 0, "functions": 0}
    }
  }
}
